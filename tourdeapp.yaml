exposedPort: 80

containers:
  - name: api
    image: registry.tourde.cloud/not-found/api
    port: 8000
    env:
      PORT: 8000
      DATABASE_URL: postgresql://postgres:password@localhost:5432/tda26
  - name: db
    image: postgres:16
    port: 5432
    env:
      POSTGRES_DB: tda26
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
  - name: caddy
    image: registry.tourde.cloud/not-found/caddy
    port: 80

build:
  - name: api
    context: ./apps/api
    dockerfile: Dockerfile
  - name: caddy
    context: ./caddy
    dockerfile: ./caddy/Dockerfile
