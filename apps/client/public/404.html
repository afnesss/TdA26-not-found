<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Stránka nenalezena - 404 | Think Different Academy</title>
    <style>
      :root {
        color-scheme: light;
        --bg: oklch(1 0 0);
        --fg: oklch(0.1 0 0);
        --muted: oklch(0.45 0 0);
        --primary: oklch(53.28% 0.144 248.22);
        --destructive: oklch(63.778% 0.14388 16.114);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          'Dosis',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          'Noto Sans',
          'Liberation Sans',
          sans-serif;
      }
      .wrap {
        text-align: center;
        max-width: 560px;
      }
      .code {
        font-size: 96px;
        font-weight: 800;
        color: var(--destructive);
        margin: 0 0 8px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        font-size: 18px;
        color: var(--muted);
      }
      button.button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--primary);
        color: #ffffff;
        border: none;
        cursor: pointer;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 16px;
        font-family: inherit;
        transition:
          transform 120ms ease,
          box-shadow 120ms ease;
        box-shadow: 0 6px 16px rgba(0, 112, 187, 0.25);
      }
      button.button:focus,
      button.button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(0, 112, 187, 0.35);
      }
    </style>
  </head>
  <body>
    <main class="wrap" role="main">
      <div class="code">404</div>
      <h1 id="title"></h1>
      <p id="desc"></p>
      <button class="button" onclick="goBack()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg>
        <span id="btn"></span>
      </button>
    </main>
    <script>
      var i18n = {
        cs: {
          title: 'Hmm... Tato stránka nebyla nalezena',
          desc: 'Stránka, kterou hledáte, neexistuje nebo byla odstraněna.',
          btn: 'Zpět',
          pageTitle: 'Stránka nenalezena - 404 | Think Different Academy',
        },
        en: {
          title: 'Hmm... Page not found',
          desc: 'The page you are looking for does not exist or has been removed.',
          btn: 'Go back',
          pageTitle: 'Page not found - 404 | Think Different Academy',
        },
      }

      var locale = localStorage.getItem('tda-ui-locale') || 'en'
      var t = i18n[locale] || i18n['en']

      document.getElementById('title').textContent = t.title
      document.getElementById('desc').textContent = t.desc
      document.getElementById('btn').textContent = t.btn
      document.title = t.pageTitle
      document.documentElement.lang = locale

      function goBack() {
        if (window.history.length > 1) {
          window.history.back()
        } else {
          window.location.href = '/'
        }
      }
    </script>
  </body>
</html>
