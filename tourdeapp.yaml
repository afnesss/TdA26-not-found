exposedPort: 80

containers:
  - name: caddy
    image: registry.tourde.cloud/not-found/caddy
    port: 80

  - name: api
    image: registry.tourde.cloud/not-found/api
    port: 3000
    env:
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:password@localhost:5432/tda26
      SESSION_SECRET: ce3D9f7e6860f7a57c669f3b275cc33fb6ae58ee31b32a5ec37bd88a5e2a63067
      NODE_ENV: production

  - name: client
    image: registry.tourde.cloud/not-found/client
    port: 3001

  - name: db
    image: postgres
    tag: "16"
    port: 5432
    env:
      POSTGRES_DB: tda26
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

build:
  - name: api
    context: ./apps/api
    dockerfile: ./apps/api/Dockerfile
  - name: client
    context: ./apps/client
    dockerfile: ./apps/client/Dockerfile
  - name: caddy
    context: ./apps/caddy
    dockerfile: ./apps/caddy/Dockerfile
