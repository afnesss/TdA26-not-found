<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Stránka nenalezena - 404 | Think Different Academy</title>
    <style>
      :root {
        color-scheme: light;
        --bg: oklch(1 0 0);
        --fg: oklch(0.1 0 0);
        --muted: oklch(0.45 0 0);
        --primary: oklch(53.28% 0.144 248.22);
        --destructive: oklch(63.778% 0.14388 16.114);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Dosis",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          "Noto Sans",
          "Liberation Sans",
          sans-serif;
      }
      .wrap {
        text-align: center;
        max-width: 560px;
      }
      .code {
        font-size: 96px;
        font-weight: 800;
        color: var(--destructive);
        margin: 0 0 8px;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        font-size: 18px;
        color: var(--muted);
      }
      a.button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--primary);
        color: #ffffff;
        text-decoration: none;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 700;
        transition: transform 120ms ease, box-shadow 120ms ease;
        box-shadow: 0 6px 16px rgba(0, 112, 187, 0.25);
      }
      a.button:focus,
      a.button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(0, 112, 187, 0.35);
      }
    </style>
  </head>
  <body>
    <main class="wrap" role="main">
      <div class="code">404</div>
      <h1>Hmm... Tato stránka nebyla nalezena</h1>
      <p>Stránka, kterou hledáte, neexistuje nebo byla odstraněná.</p>
      <a class="button" href="/courses">Zpět na přehled kurzů</a>
    </main>
  </body>
</html>
