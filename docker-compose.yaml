services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tda26
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@db:5432/tda26
      SESSION_SECRET: ce39f7e6860f7a57c669f3b275cc33fb6ae58ee31b32a5ec37bd88a5e2a63067
    depends_on:
      - db
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      target: development
    command: npm run dev
    ports:
      - "3001:3001"
    depends_on:
      - api
    volumes:
      - ./apps/client:/app
      - /app/node_modules

  caddy:
    build:
      context: ./apps/caddy
      dockerfile: Dockerfile
    ports:
      # Expose Caddy's port 80 to the host's port 8080
      - "8080:80"
    depends_on:
      - api
      - client
    # Mount the Caddyfile for easy local changes without rebuilding the image
    volumes:
      - ./apps/caddy/Caddyfile.development:/etc/caddy/Caddyfile

volumes:
  db_data:
    driver: local
