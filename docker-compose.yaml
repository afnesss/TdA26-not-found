services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tda26
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tda26"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@db:5432/tda26
      SESSION_SECRET: ce39f7e6860f7a57c669f3b275cc33fb6ae58ee31b32a5ec37bd88a5e2a63067
      JWT_SECRET: 8f6e4b57e7f54668a1f8c5d4f9a0c2d7e1b3a6c9d2f4e8a1b7c5d3e9f0a2b4c6
      NODE_ENV: development
      ADMIN_USERNAME: superadmin
      ADMIN_PASSWORD: TdA26!
      ORG_DEFAULT_PASSWORD: TdA26!
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - uploads_data:/app/uploads

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      target: development
    command: npm run dev
    ports:
      - "3001:3001"
    depends_on:
      - api
    volumes:
      - ./apps/client:/app
      - /app/node_modules

  caddy:
    build:
      context: ./apps/caddy
      dockerfile: Dockerfile
    ports:
      # Expose Caddy's port 80 to the host's port 8080
      - "8080:80"
    depends_on:
      - api
      - client
    # Mount the Caddyfile for easy local changes without rebuilding the image
    volumes:
      - ./apps/caddy/Caddyfile.development:/etc/caddy/Caddyfile

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
