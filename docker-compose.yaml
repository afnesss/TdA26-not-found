services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tda26
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CHANGE_ME_DB_PASSWORD
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tda26"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    command: npm run dev
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:CHANGE_ME_DB_PASSWORD@db:5432/tda26
      SESSION_SECRET: CHANGE_ME_SESSION_SECRET
      JWT_SECRET: CHANGE_ME_JWT_SECRET
      NODE_ENV: development
      ADMIN_USERNAME: CHANGE_ME_ADMIN_USERNAME
      ADMIN_PASSWORD: CHANGE_ME_ADMIN_PASSWORD
      ORG_DEFAULT_PASSWORD: CHANGE_ME_ORG_DEFAULT_PASSWORD
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - uploads_data:/app/uploads

  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
      target: development
    command: npm run dev
    ports:
      - "3001:3001"
    depends_on:
      - api
    volumes:
      - ./apps/client:/app
      - /app/node_modules

  caddy:
    build:
      context: ./apps/caddy
      dockerfile: Dockerfile
    ports:
      # Expose Caddy's port 80 to the host's port 8080
      - "8080:80"
    depends_on:
      - api
      - client
    # Mount the Caddyfile for easy local changes without rebuilding the image
    volumes:
      - ./apps/caddy/Caddyfile.development:/etc/caddy/Caddyfile

volumes:
  db_data:
    driver: local
  uploads_data:
    driver: local
